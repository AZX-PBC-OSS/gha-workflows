name: Publish Python package to PyPI

on:
  workflow_call:
    inputs:
      dist-name:
        description: Distribution name on PyPI (the [project] name in pyproject.toml).
        required: true
        type: string
      python-version:
        description: Python version to build and test under (e.g. "3.12").
        required: true
        type: string
      tag-name:
        description: Git tag to build and publish (e.g. v0.2.0).
        required: true
        type: string
      environment-name:
        description: GitHub environment for the publish job (matches the PyPI trusted-publisher environment).
        required: false
        type: string
        default: pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag-name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ inputs.python-version }}

      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ inputs.tag-name }}
          DIST_NAME: ${{ inputs.dist-name }}
        run: |
          set -euo pipefail
          tag="${TAG_NAME#v}"
          version="$(uv run python -c 'import importlib.metadata, os; print(importlib.metadata.version(os.environ["DIST_NAME"]))')"
          echo "Tag: ${tag}"
          echo "project version: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Git tag ${tag} does not match project version ${version}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test install from wheel
        env:
          DIST_NAME: ${{ inputs.dist-name }}
        run: |
          uv venv test-env
          uv pip install --python test-env/bin/python dist/*.whl
          cd /tmp && $GITHUB_WORKSPACE/test-env/bin/python -c "import importlib.metadata, os; print(importlib.metadata.version(os.environ['DIST_NAME']))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment-name }}
      url: https://pypi.org/project/${{ inputs.dist-name }}/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Attestations are disabled because this workflow is always a
          # reusable workflow: the Sigstore certificate records the CALLER's
          # top-level workflow, which PyPI cannot match against this repo's
          # trusted publisher. The OIDC token is unaffected (PyPI matches
          # job_workflow_ref to this file). See README.
          attestations: false
